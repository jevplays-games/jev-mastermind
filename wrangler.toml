name = "jev-typecrack"
main = "server/worker.js"
compatibility_date = "2026-02-13"
# mastermind.jevplay.games is the pre-rename hostname. It stays attached and served (see LEGACY_ORIGINS)
# until the 301 redirect rule replaces it at cutover.
routes = [
  { pattern = "typecrack.jevplay.games", custom_domain = true },
  { pattern = "mastermind.jevplay.games", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Route every request through the security-header wrapper. This favors consistent CSP over a bypass.
run_worker_first = true

[[d1_databases]]
binding = "DB"
# Pre-rename database name, kept on purpose: D1 has no in-place rename and the owner chose not to migrate.
database_name = "mastermind"
database_id = "7c9eab40-37fb-41d4-bd2a-943cd3ac86d8"
migrations_dir = "schema"

[vars]
APP_ORIGIN = "https://typecrack.jevplay.games"
# Comma-separated pre-rename origins still answered on their own origin until cutover.
LEGACY_ORIGINS = "https://mastermind.jevplay.games"
JEV_MODEL = "jev-1.13.0"
RANKED_ENABLED = "false"
MAX_STARTS_PER_HOUR = "2000"
MAX_PROVIDER_ATTEMPTS_PER_DAY = "10000"

# Disabled: Workers Free allows 5 cron triggers per account and other games use them.
# Without it, stalled Jev steps are not auto-recovered and expired rows are not swept. Restore on a paid plan.
# [triggers]
# crons = ["*/5 * * * *"]

[observability]
enabled = true
# Do not enable request-header/body capture. Application events use an explicit safe-field allowlist.
